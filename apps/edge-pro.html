<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Edge Pro" />
  <meta name="theme-color" content="#070a10" />
  <title>Antigravity Edge Pro — Live Multi-Book +EV & NFL TD Sniper</title>
  <style>
    :root {
      --bg: #070a10;
      --bg2: #0d121d;
      --card: #121927;
      --card-hi: #182235;
      --line: rgba(148, 163, 184, 0.14);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --green: #10b981;
      --green-bright: #34d399;
      --green-bg: rgba(16, 185, 129, 0.14);
      --blue: #3b82f6;
      --cyan: #06b6d4;
      --gold: #f59e0b;
      --gold-bg: rgba(245, 158, 11, 0.14);
      --purple: #8b5cf6;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 96px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 60;
      background: rgba(7, 10, 16, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 10px;
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .brand-title { font-size: 18px; font-weight: 900; letter-spacing: -0.03em; display: flex; align-items: center; gap: 7px; }
    .brand-accent { background: linear-gradient(135deg, #34d399, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-bright); box-shadow: 0 0 10px var(--green-bright); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }
    .sub-meta { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .btn-pill {
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 6px 11px; font-size: 11px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-pill:active { transform: scale(0.96); }
    .btn-refresh.spinning span.ico { display: inline-block; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-box {
      flex: 1; background: var(--bg2); border: 1px solid var(--line); color: var(--text);
      border-radius: 12px; padding: 9px 12px; font-size: 13px; outline: none;
    }
    .search-box:focus { border-color: var(--blue); }
    .bankroll-box {
      display: flex; align-items: center; gap: 4px; background: var(--bg2);
      border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; font-size: 11px; color: var(--muted); font-weight: 700;
    }
    .bankroll-box input {
      width: 54px; background: transparent; border: none; color: var(--green-bright);
      font-weight: 800; font-size: 13px; outline: none; text-align: right;
    }

    .nav-tabs {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
    }
    .nav-tab {
      background: var(--bg2); border: 1px solid var(--line); color: var(--muted);
      border-radius: 10px; padding: 7px 4px; font-size: 10.5px; font-weight: 800;
      text-align: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-tab.active {
      background: linear-gradient(135deg, rgba(16,185,129,0.22), rgba(59,130,246,0.22));
      border-color: rgba(52, 211, 153, 0.55); color: #fff;
    }

    .container { max-width: 860px; margin: 0 auto; padding: 12px 12px 24px; }
    .kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 12px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 9px; }
    .kpi-val { font-size: 15px; font-weight: 900; color: #fff; }
    .kpi-lbl { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; font-weight: 700; }

    .chip-row {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; background: var(--card); border: 1px solid var(--line); color: var(--muted);
      padding: 6px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .chip.active { background: #1e293b; color: #fff; border-color: var(--blue); }

    .game-header {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(90deg, rgba(30,41,59,0.85), rgba(18,25,39,0.65));
      border: 1px solid var(--line); border-radius: 13px; padding: 9px 12px; margin: 16px 0 8px;
    }
    .game-title { font-size: 13px; font-weight: 900; letter-spacing: 0.02em; color: #fff; }
    .game-sub { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .game-line-pill {
      font-size: 10.5px; font-weight: 800; color: var(--cyan);
      background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.3);
      padding: 4px 8px; border-radius: 8px;
    }

    .team-subhdr {
      font-size: 10.5px; font-weight: 900; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.07em; margin: 8px 2px 6px; display: flex; justify-content: space-between;
    }

    .p-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 11px; margin-bottom: 8px; transition: border-color 0.15s;
    }
    .p-card.ev-positive { border-color: rgba(16, 185, 129, 0.42); }
    .p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .p-name { font-size: 14.5px; font-weight: 800; color: #fff; line-height: 1.2; }
    .p-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 4px; }
    .badge {
      font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .b-team { background: #1e293b; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); }
    .b-fair { background: rgba(59,130,246,0.14); color: #93c5fd; }
    .b-ev { background: var(--green-bg); color: var(--green-bright); border: 1px solid rgba(52,211,153,0.35); }
    .b-mid { background: var(--gold-bg); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .b-kelly { background: rgba(139,92,246,0.16); color: #c4b5fd; }

    .slip-add-btn {
      background: #1e293b; border: 1px solid rgba(148,163,184,0.28); color: #e2e8f0;
      border-radius: 9px; padding: 5px 9px; font-size: 11px; font-weight: 800; cursor: pointer; flex-shrink: 0;
    }
    .slip-add-btn.in-slip {
      background: var(--green-bg); border-color: var(--green-bright); color: var(--green-bright);
    }

    .books-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    }
    .bk-cell {
      background: var(--bg2); border: 1px solid rgba(148,163,184,0.1); border-radius: 8px;
      padding: 5px 2px; text-align: center;
    }
    .bk-cell.best {
      background: rgba(16, 185, 129, 0.16);
      border: 1.5px solid var(--green-bright);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
    }
    .bk-lbl { font-size: 8.5px; font-weight: 800; color: var(--dim); text-transform: uppercase; }
    .bk-cell.best .bk-lbl { color: var(--green-bright); }
    .bk-val { font-size: 11.5px; font-weight: 800; color: #e2e8f0; margin-top: 2px; }
    .bk-cell.best .bk-val { color: #fff; font-weight: 900; }
    .bk-sub { font-size: 8.5px; color: var(--muted); margin-top: 1px; }

    .edge-foot {
      margin-top: 7px; font-size: 10.5px; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;
    }
    .edge-foot strong { color: var(--green-bright); }

    /* Sharp Money Bars */
    .split-row { margin-top: 8px; }
    .split-hdr { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
    .bar-track { height: 7px; background: #1e293b; border-radius: 999px; overflow: hidden; display: flex; }
    .bar-fill-tix { background: #64748b; height: 100%; }
    .bar-fill-mon { background: linear-gradient(90deg, #f59e0b, #10b981); height: 100%; }

    .floating-slip {

    .calc-box {

    .calc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .calc-inp {
      width: 100%; background: var(--bg2); border: 1px solid var(--line); color: #fff;
      border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 700;
    }
    .payout-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; border-radius: 9px; background: var(--bg2); border: 1px solid var(--line); margin-top: 6px;
    }
    .payout-row.winner { border-color: var(--green-bright); background: rgba(16,185,129,0.13); }
    .empty-msg { text-align: center; color: var(--muted); padding: 28px 14px; font-size: 13px; }
  </style>
</head>

  <script>

    function amToDec(am) {
      if (am === null || am === undefined || isNaN(am)) return null;
      const n = Number(am);
      return n > 0 ? 1 + (n / 100) : 1 + (100 / Math.abs(n));
    }
    function amToProb(am) {
      const d = amToDec(am);
      return d ? (1 / d) : 0;
    }
    function probToAm(p) {
      const cl = Math.max(0.005, Math.min(0.99, p));
      return cl >= 0.5 ? Math.round(-100 * cl / (1 - cl)) : Math.round(100 * (1 - cl) / cl);
    }
    function fmtAm(am) {
      if (am === null || am === undefined || isNaN(am)) return '—';
      const n = Math.round(Number(am));
      return n > 0 ? `+${n}` : `${n}`;
    }

    async function decryptPublicBeaconSlot(slotObj, secret) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(slotObj.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(slotObj.iv), c => c.charCodeAt(0));
      const ct = Uint8Array.from(atob(slotObj.ct), c => c.charCodeAt(0));
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
      const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: slotObj.iter || 100000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, ct);
      return JSON.parse(new TextDecoder().decode(plainBuf));
    }

    async function discoverApiBase() {
      if (location.hostname.endsWith('trycloudflare.com') || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        return location.origin;
      }
      try {
        const r = await fetch('../tunnel.json?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) {
          const b = await r.json();
          if (b && b.apps_public_slot) {
            const dec = await decryptPublicBeaconSlot(b.apps_public_slot, 'michael-edge-public-v1');
            if (dec && dec.tunnelUrl) return dec.tunnelUrl.replace(/\/$/, '');
          }
        }
      } catch (_) {}
      return '';
    }

    async function refreshLiveOdds(force = false) {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      try {
        let updated = false;
        const base = await discoverApiBase();
        if (base) {
          const r = await fetch(`${base}/api/public/sports-edge${force ? '?refresh=1' : ''}`, { cache: 'no-store' });
          if (r.ok) {
            const d = await r.json();
            if (d && d.ok) { EDGE = d; updated = true; }
          }
        }
        if (!updated) {
          const rf = await fetch('./edge-feed.json?t=' + Date.now(), { cache: 'no-store' });
          if (rf.ok) {
            const df = await rf.json();
            if (df && df.ok) { EDGE = df; updated = true; }
          }
        }
        if (updated) {
          renderHeaderAndKpis();
          renderActiveTab();
        }
      } catch (e) {
        console.log('Snapshot active:', e.message);
      } finally {
        btn.classList.remove('spinning');
      }
    }

    function switchTab(t) {
      state.tab = t;
      document.querySelectorAll('.nav-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === t);
      });
      renderActiveTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleSlipById(id) {
      const item = ITEM_MAP[id] || { id };
      toggleSlipItem(item);
    }

    function toggleSlipItem(item) {
      const idx = state.slip.findIndex(x => x.id === item.id);
      if (idx >= 0) {
        state.slip.splice(idx, 1);
      } else {
        if (state.slip.length >= 6) {
          alert('Max 6 legs in Smart Parlay Slip for optimal EV.');
          return;
        }
        state.slip.push(item);
      }
      updateFloatingSlip();
      renderActiveTab();
    }

    function updateFloatingSlip() {
      const bar = document.getElementById('floatingSlip');
      if (!state.slip.length || state.tab === 'lab') {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      let bestCombDec = 1;
      state.slip.forEach(s => { bestCombDec *= (amToDec(s.best_odds) || 1); });
      const bestAm = probToAm(1 / bestCombDec);
      document.getElementById('floatingSlipLeft').textContent = `🎟️ ${state.slip.length} Leg${state.slip.length > 1 ? 's' : ''} (${fmtAm(bestAm)})`;
      document.getElementById('floatingSlipRight').textContent = `$${state.parlayStake} → $${(state.parlayStake * bestCombDec).toFixed(0)} • Open Lab →`;
    }

    function renderHeaderAndKpis() {

    }

    function renderTdPlayerCard(p) {
      ITEM_MAP[p.id] = p;
      const inSlip = state.slip.some(x => x.id === p.id);
      const cells = BOOKS.map(b => {
        const bo = (p.books && p.books[b.id]) || { odds: null, display: '—' };
        const isBest = bo.odds !== null && p.best_book === b.id;
        return `<div class="bk-cell ${isBest ? 'best' : ''}">
          <div class="bk-lbl">${b.label}</div>
          <div class="bk-val">${bo.display || '—'}</div>
        </div>`;
      }).join('');

      const edgeBadge = p.market_edge_pct >= 4
        ? `<span class="badge b-ev">+${p.market_edge_pct.toFixed(1)}% vs Avg</span>`
        : '';
      const extraTxt = p.extra_profit_per_100 >= 8
        ? `Shopping <strong>${p.best_book_name} (${p.best_display})</strong> pays <strong>+$${p.extra_profit_per_100.toFixed(0)} more</strong> per $100 vs ${p.worst_display}`
        : `Best Price: <strong>${p.best_book_name} ${p.best_display}</strong>`;

      return `
        <div class="p-card ${p.market_edge_pct >= 5 ? 'ev-positive' : ''}">
          <div class="p-top">
            <div>
              <div class="p-name">${p.player}</div>
              <div class="p-tags">
                <span class="badge b-team">${p.team}</span>
                <span class="badge b-fair">Win ${p.fair_prob_pct}% • Avg ${p.consensus_display || p.fair_display}</span>

            </div>
            <button class="slip-add-btn ${inSlip ? 'in-slip' : ''}" onclick="toggleSlipById('${p.id}')">
              ${inSlip ? '✓ In Slip' : '+ Slip'}

          </div>
          <div class="books-grid">${cells}</div>
          <div class="edge-foot">
            <span>${extraTxt}</span>
            <span>${p.game_label || ''}</span>
          </div>
        </div>
      `;
    }

    function renderTwoWayPropCard(p) {
      ITEM_MAP[p.id] = p;
      const inSlip = state.slip.some(x => x.id === p.id);
      const cells = BOOKS.map(b => {
        const bo = p.books && p.books[b.id];
        const isBest = bo && p.best_book === b.id;
        return `<div class="bk-cell ${isBest ? 'best' : ''}">
          <div class="bk-lbl">${b.label}</div>
          <div class="bk-val">${bo ? fmtAm(bo.odds) : '—'}</div>
          <div class="bk-sub">${bo ? (p.side === 'OVER' ? 'O ' : 'U ') + bo.line : ''}</div>

      const kellyDollar = Math.max(0, Math.round((state.bankroll * (p.kelly_pct || 0)) / 100));

      return `

      `;
      let list = (EDGE.ev_snipes || []).slice();
      if (state.evSport !== 'ALL') list = list.filter(x => x.sport === state.evSport);
      if (q) list = list.filter(x => `${x.player} ${x.team} ${x.pick_label} ${x.game_label}`.toLowerCase().includes(q));
      document.getElementById('mainContent').innerHTML = list.map(item =>
        item.kind === 'td_snipe' ? renderTdPlayerCard(item) : renderTwoWayPropCard(item)
      ).join('') || '<div class="empty-msg">No +EV snipes match your filter right now.</div>';
    }

    function renderNbaTab(q) {
      const mkts = ['ALL', 'Points', 'Rebounds', 'Assists', '3-Pointers', 'Pts+Reb+Ast'];
      document.getElementById('controlsArea').innerHTML = `
        <div class="chip-row">
          ${mkts.map(m => `<div class="chip ${state.nbaMarket === m ? 'active' : ''}" onclick="state.nbaMarket='${m}';renderActiveTab()">${m}</div>`).join('')}
        </div>
      `;
      let list = (EDGE.nba_props || []).slice();
      if (state.nbaMarket !== 'ALL') list = list.filter(p => p.market_label === state.nbaMarket);
      if (q) list = list.filter(p => `${p.player} ${p.team} ${p.pick_label} ${p.game_label}`.toLowerCase().includes(q));
      document.getElementById('mainContent').innerHTML = list.slice(0, 90).map(renderTwoWayPropCard).join('')
        || '<div class="empty-msg">No NBA props match your filter right now.</div>';
    }

    function renderSharpTab(q) {
      document.getElementById('controlsArea').innerHTML = `
        <div class="chip-row">
          <div class="chip ${state.sharpSport === 'ALL' ? 'active' : ''}" onclick="state.sharpSport='ALL';renderActiveTab()">🦈 All Sharp Splits</div>
          <div class="chip ${state.sharpSport === 'NFL' ? 'active' : ''}" onclick="state.sharpSport='NFL';renderActiveTab()">🏈 NFL Week ${EDGE.nfl_week || ''}</div>
          <div class="chip ${state.sharpSport === 'NBA' ? 'active' : ''}" onclick="state.sharpSport='NBA';renderActiveTab()">🏀 NBA Tonight</div>
        </div>
      `;
      let games = (EDGE.sharp_games || []).slice();
      if (state.sharpSport !== 'ALL') games = games.filter(g => g.sport === state.sharpSport);
      if (q) games = games.filter(g => `${g.game_label} ${g.away_name} ${g.home_name}`.toLowerCase().includes(q));

      document.getElementById('mainContent').innerHTML = games.map(g => {
        const sp = g.splits || {};
        const sigBadges = (g.sharp_signals || []).map(s =>
          `<span class="badge b-ev">🦈 SHARP: ${s.side_label} (${s.tickets_pct}% Tix vs ${s.money_pct}% Money • +${s.diff_pct}% Handle) ${s.best_line ? '• Best: ' + s.best_book + ' ' + s.best_line : ''}</span>`
        ).join('');

        const spreadBooks = ['dk','fd','mgm','czr'].map(bk => {
          const d = (g.spread_books || {})[bk] || {};
          return `<div class="bk-cell" style="grid-column: span 1">
            <div class="bk-lbl">${bk.toUpperCase()}</div>
            <div class="bk-val" style="font-size:10.5px">${d.away ? g.away_abbr + ' ' + d.away.display : '—'}</div>
            <div class="bk-sub" style="font-size:10px;color:#cbd5e1">${d.home ? g.home_abbr + ' ' + d.home.display : '—'}</div>
          </div>`;
        }).join('');

        return `
          <div class="p-card ${g.max_sharp_diff >= 10 ? 'ev-positive' : ''}">
            <div class="p-top">
              <div>
                <div class="p-name">[${g.sport}] ${g.away_name} @ ${g.home_name}</div>
                <div class="p-tags" style="margin-top:6px">${sigBadges || '<span class="badge b-team">Balanced Action</span>'}</div>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0">${spreadBooks}</div>
            ${sp.away_spread_tickets !== null && sp.away_spread_tickets !== undefined ? `
              <div class="split-row">
                <div class="split-hdr">
                  <span>Spread Public Tickets: ${g.away_abbr} ${sp.away_spread_tickets}% / ${g.home_abbr} ${sp.home_spread_tickets}%</span>
                  <span style="color:var(--green-bright)">Money Handle: ${g.away_abbr} ${sp.away_spread_money}% / ${g.home_abbr} ${sp.home_spread_money}%</span>
                </div>
                <div class="bar-track">
                  <div class="bar-fill-mon" style="width:${sp.away_spread_money || 50}%"></div>
                </div>
              </div>
            ` : ''}
            ${sp.over_tickets !== null && sp.over_tickets !== undefined ? `
              <div class="split-row">
                <div class="split-hdr">
                  <span>Total Public Tickets: Over ${sp.over_tickets}% / Under ${sp.under_tickets}%</span>
                  <span style="color:var(--gold)">Money Handle: Over ${sp.over_money}% / Under ${sp.under_money}%</span>
                </div>
                <div class="bar-track">
                  <div class="bar-fill-mon" style="width:${sp.over_money || 50}%"></div>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('') || '<div class="empty-msg">No live game splits found.</div>';
    }

    function runCustomDevig() {
      const o1 = Number(document.getElementById('dvOdds1').value);
      const o2 = Number(document.getElementById('dvOdds2').value);
      const boost = Number(document.getElementById('dvBoost').value || 0);
      const out = document.getElementById('dvResult');
      if (!o1 || !o2 || Math.abs(o1) < 100 || Math.abs(o2) < 100) {
        out.innerHTML = 'Enter valid American odds (e.g. -110 and -110, or +120 and -145).';
        return;
      }
      const p1 = amToProb(o1), p2 = amToProb(o2);
      const hold = ((p1 + p2) - 1) * 100;
      const fair1 = p1 / (p1 + p2);
      const rawDec = amToDec(o1);
      const boostedDec = 1 + (rawDec - 1) * (1 + boost / 100);
      const ev = ((fair1 * boostedDec) - 1) * 100;
      const kelly = Math.max(0, 0.25 * (((boostedDec - 1) * fair1 - (1 - fair1)) / (boostedDec - 1)));
      out.innerHTML = `
        <div style="margin-top:10px;padding:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;line-height:1.6">
          <div>Book Vig / Hold: <strong>${hold.toFixed(2)}%</strong> • True Fair Win Prob: <strong>${(fair1*100).toFixed(1)}% (${fmtAm(probToAm(fair1))})</strong></div>
          <div>Effective Odds${boost ? ` (+${boost}% Boost)` : ''}: <strong>${fmtAm(probToAm(1/boostedDec))}</strong> • Expected Value: <strong style="color:${ev >= 0 ? 'var(--green-bright)' : '#f87171'}">${ev >= 0 ? '+' : ''}${ev.toFixed(2)}% EV</strong></div>
          <div>Recommended 1/4-Kelly Bet (on $${state.bankroll} roll): <strong style="color:#c4b5fd">$${Math.round(state.bankroll * kelly)}</strong></div>
        </div>
      `;
    }

    function renderLabTab() {
      document.getElementById('controlsArea').innerHTML = '';
      const main = document.getElementById('mainContent');

      let slipHtml = '';
      if (!state.slip.length) {
        slipHtml = `<div class="empty-msg">Tap <strong>+ Slip</strong> on any NFL TD Scorer or NBA/+EV Prop to compare exact parlay payouts across DraftKings, FanDuel, Hard Rock, BetMGM, Caesars & Fanatics!</div>`;
      } else {
        // Check Same-Game Correlation warnings
        const teamCounts = {};
        state.slip.forEach(s => {
          if (s.market_key === 'anytd') teamCounts[s.team] = (teamCounts[s.team] || 0) + 1;
        });
        const cannibalTeams = Object.keys(teamCounts).filter(t => teamCounts[t] >= 2);
        const corrBanner = cannibalTeams.length
          ? `<div style="background:var(--gold-bg);border:1px solid rgba(245,158,11,0.45);color:#fde68a;padding:9px 11px;border-radius:10px;font-size:11.5px;margin-bottom:10px;font-weight:700">
               ⚠️ Correlation Alert: You stacked multiple Anytime TD scorers on <strong>${cannibalTeams.join(', ')}</strong>. Two players can't score on the same play — books heavily tax same-team TD parlays unless paired with an opposing shootout scorer!
             </div>`
          : `<div style="background:var(--green-bg);border:1px solid rgba(52,211,153,0.4);color:#a7f3d0;padding:8px 11px;border-radius:10px;font-size:11.5px;margin-bottom:10px;font-weight:700">
               ✅ Clean Independent / Cross-Team Parlay Structure — Zero Same-Team TD Cannibalization.
             </div>`;

        let fairCombProb = 1;
        state.slip.forEach(s => { fairCombProb *= ((s.fair_prob_pct || 40) / 100); });

        // Compute payout per book
        const bookPayouts = BOOKS.map(b => {
          let dec = 1;
          let missing = 0;
          state.slip.forEach(s => {
            const bo = s.books && s.books[b.id];
            const am = bo && bo.odds !== null && bo.odds !== undefined ? bo.odds : s.best_odds;
            if (!bo || bo.odds === null || bo.odds === undefined) missing++;
            dec *= (amToDec(am) || 1);
          });
          return {
            book: b,
            dec,
            american: probToAm(1 / dec),
            payout: state.parlayStake * dec,
            profit: state.parlayStake * (dec - 1),
            missing
          };
        }).sort((a, b) => b.payout - a.payout);

        const topPay = bookPayouts[0].payout;
        const lowPay = bookPayouts[bookPayouts.length - 1].payout;

        slipHtml = `
          ${corrBanner}
          ${state.slip.map(s => `
            <div class="payout-row">
              <div>
                <div style="font-weight:800;font-size:13px">${s.player} — <span style="color:var(--green-bright)">${s.pick_label || s.market_label}</span></div>
                <div style="font-size:10.5px;color:var(--muted)">${s.team} • Best: ${s.best_book_name} ${s.best_display} • Fair Win ${s.fair_prob_pct}%</div>
              </div>
              <button class="slip-add-btn" onclick="toggleSlipItem({id:'${s.id}'})">✕</button>
            </div>
          `).join('')}

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px">
            <div style="font-size:12px;font-weight:800;color:var(--muted)">
              True Hit Prob: <strong style="color:#fff">${(fairCombProb*100).toFixed(1)}% (${fmtAm(probToAm(fairCombProb))})</strong>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:11.5px;color:var(--muted);font-weight:700">Wager $</span>
              <input type="number" class="calc-inp" style="width:74px;padding:5px 8px" value="${state.parlayStake}" min="5" step="5"
                onchange="state.parlayStake=Math.max(1,Number(this.value||25));localStorage.setItem('edge_stake',String(state.parlayStake));renderLabTab()" />
              <button class="slip-add-btn" onclick="state.slip=[];updateFloatingSlip();renderLabTab()">Clear</button>
            </div>
          </div>

          <div style="margin-top:12px;font-size:11.5px;font-weight:900;color:var(--green-bright);text-transform:uppercase">
            💰 Parlay Line Shopper — Save +$${(topPay - lowPay).toFixed(2)} by picking the top book:
          </div>
          ${bookPayouts.map((bp, idx) => `
            <div class="payout-row ${idx === 0 ? 'winner' : ''}">
              <div>
                <strong style="font-size:13px">${idx === 0 ? '🏆 ' : ''}${bp.book.name}</strong>
                <span style="font-size:11px;color:var(--muted);margin-left:6px">${fmtAm(bp.american)}${bp.missing ? ` (${bp.missing} leg est.)` : ''}</span>
              </div>
              <div style="text-align:right">
                <div style="font-weight:900;font-size:14px;color:${idx === 0 ? 'var(--green-bright)' : '#fff'}">$${bp.payout.toFixed(2)}</div>
                <div style="font-size:10px;color:var(--muted)">+$${bp.profit.toFixed(2)} profit</div>
              </div>
            </div>
          `).join('')}
        `;
      }

      main.innerHTML = `
        <div class="calc-box">
          <div style="font-size:14px;font-weight:900;margin-bottom:8px">🎟️ Smart Multi-Book Parlay & Correlation Builder</div>
          ${slipHtml}
        </div>

        <div class="calc-box">
          <div style="font-size:14px;font-weight:900">🧮 Instant Sportsbook Profit-Boost & No-Vig Calculator</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">Check if a DraftKings/FanDuel Profit Boost (+25%, +30%, +50%) turns a line into mathematical +EV:</div>
          <div class="calc-grid">
            <div>
              <div style="font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700">Your Side Odds (e.g. -110 or +140)</div>
              <input type="number" id="dvOdds1" class="calc-inp" value="-110" oninput="runCustomDevig()" />
            </div>
            <div>
              <div style="font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700">Other Side Odds (e.g. -110 or -170)</div>
              <input type="number" id="dvOdds2" class="calc-inp" value="-110" oninput="runCustomDevig()" />
            </div>
          </div>
          <div style="margin-top:8px">
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700">Sportsbook Profit Boost % (0, 25, 30, 50, 100)</div>
            <input type="number" id="dvBoost" class="calc-inp" value="25" min="0" max="200" step="5" oninput="runCustomDevig()" />
          </div>
          <div id="dvResult"></div>
        </div>
      `;
      runCustomDevig();
    }

    function renderActiveTab() {
      updateFloatingSlip();
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      if (state.tab === 'td') renderNflTdTab(q);
      else if (state.tab === 'ev') renderEvTab(q);
      else if (state.tab === 'nba') renderNbaTab(q);
      else if (state.tab === 'sharp') renderSharpTab(q);
      else if (state.tab === 'lab') renderLabTab();
    }

    renderHeaderAndKpis();
    renderActiveTab();
    setTimeout(() => refreshLiveOdds(false), 400);
  </script>
</body>
</html>
