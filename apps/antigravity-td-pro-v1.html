<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antigravity TD Pro | NFL Odds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --success: #4ade80;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .odds-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.1s ease;
        }
        .odds-card:active {
            transform: scale(0.98);
        }
        .best-price {
            color: var(--success);
            font-weight: 800;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 6px;
        }
        .book-name {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }
        input::placeholder {
            color: #475569;
        }
        .tab-bar {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-header px-4 py-4 mb-4">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-xl font-black tracking-tighter text-white">ANTIGRAVITY <span class="text-blue-500">TD PRO</span></h1>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Week 10 Anytime TD Tracker</p>
            </div>
            <div class="bg-blue-500/10 p-2 rounded-full">
                <i class="fa-solid fa-bolt text-blue-500"></i>
            </div>
        </div>
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="search" placeholder="Search Player or Team..." 
                class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all">
        </div>
    </header>

    <!-- Main Content -->
    <main id="app" class="px-4 space-y-6">
        <!-- Content injected by JS -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 tab-bar px-6 py-3 flex justify-between items-center z-50">
        <div class="flex flex-col items-center text-blue-500">
            <i class="fa-solid fa-house text-lg mb-1"></i>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </div>
        <div class="flex flex-col items-center text-slate-500">
            <i class="fa-solid fa-fire text-lg mb-1"></i>
            <span class="text-[10px] font-bold uppercase">Hot Picks</span>
        </div>
        <div class="flex flex-col items-center text-slate-500">
            <i class="fa-solid fa-chart-line text-lg mb-1"></i>
            <span class="text-[10px] font-bold uppercase">Trends</span>
        </div>
        <div class="flex flex-col items-center text-slate-500">
            <i class="fa-solid fa-gear text-lg mb-1"></i>
            <span class="text-[10px] font-bold uppercase">Settings</span>
        </div>
    </nav>

    <script>
        const oddsData = [
            {
                team: "Detroit Lions",
                players: [
                    { name: "Amon-Ra St. Brown", pos: "WR", dk: "+125", fd: "+110", hr: "+115", mgm: "+110", best: "dk" },
                    { name: "Jahmyr Gibbs", pos: "RB", dk: "-150", fd: "-145", hr: "-135", mgm: "-140", best: "hr" },
                    { name: "David Montgomery", pos: "RB", dk: "-140", fd: "-135", hr: "-140", mgm: "-135", best: "fd" }
                ]
            },
            {
                team: "Baltimore Ravens",
                players: [
                    { name: "Derrick Henry", pos: "RB", dk: "-190", fd: "-185", hr: "-175", mgm: "-180", best: "hr" },
                    { name: "Lamar Jackson", pos: "QB", dk: "+140", fd: "+135", hr: "+145", mgm: "+140", best: "hr" },
                    { name: "Zay Flowers", pos: "WR", dk: "+160", fd: "+155", hr: "+165", mgm: "+160", best: "hr" }
                ]
            },
            {
                team: "San Francisco 49ers",
                players: [
                    { name: "Christian McCaffrey", pos: "RB", dk: "-290", fd: "-280", hr: "-260", mgm: "-275", best: "hr" },
                    { name: "Deebo Samuel", pos: "WR", dk: "+130", fd: "+125", hr: "+135", mgm: "+130", best: "hr" },
                    { name: "George Kittle", pos: "TE", dk: "+150", fd: "+145", hr: "+155", mgm: "+150", best: "hr" }
                ]
            },
            {
                team: "Buffalo Bills",
                players: [
                    { name: "Josh Allen", pos: "QB", dk: "-105", fd: "-110", hr: "+105", mgm: "-115", best: "hr" },
                    { name: "James Cook", pos: "RB", dk: "+110", fd: "+105", hr: "+115", mgm: "+110", best: "hr" },
                    { name: "Khalil Shakir", pos: "WR", dk: "+180", fd: "+175", hr: "+185", mgm: "+180", best: "hr" }
                ]
            },
            {
                team: "Philadelphia Eagles",
                players: [
                    { name: "Saquon Barkley", pos: "RB", dk: "-185", fd: "-180", hr: "-170", mgm: "-175", best: "hr" },
                    { name: "Jalen Hurts", pos: "QB", dk: "-115", fd: "-120", hr: "-110", mgm: "-115", best: "hr" },
                    { name: "A.J. Brown", pos: "WR", dk: "+145", fd: "+140", hr: "+150", mgm: "+145", best: "hr" }
                ]
            }
        ];

        function render(filter = "") {
            const container = document.getElementById('app');
            container.innerHTML = '';

            const filtered = oddsData.filter(t => 
                t.team.toLowerCase().includes(filter.toLowerCase()) || 
                t.players.some(p => p.name.toLowerCase().includes(filter.toLowerCase()))
            );

            filtered.forEach(team => {
                const section = document.createElement('div');
                section.innerHTML = `<h2 class="text-[11px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 ml-1">${team.team}</h2>`;
                
                const grid = document.createElement('div');
                grid.className = 'space-y-3';

                team.players.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'odds-card rounded-2xl p-4 shadow-sm';
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-white text-base">${p.name}</h3>
                                <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md font-bold uppercase">${p.pos}</span>
                            </div>
                            <div class="text-blue-500 text-xs font-bold">
                                <i class="fa-solid fa-chart-simple mr-1"></i> Compare
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            <div class="text-center p-2 rounded-xl ${p.best === 'dk' ? 'best-price' : 'bg-slate-900/50'}">
                                <p class="book-name">DK</p>
                                <p class="text-sm font-bold">${p.dk}</p>
                            </div>
                            <div class="text-center p-2 rounded-xl ${p.best === 'fd' ? 'best-price' : 'bg-slate-900/50'}">
                                <p class="book-name">FD</p>
                                <p class="text-sm font-bold">${p.fd}</p>
                            </div>
                            <div class="text-center p-2 rounded-xl ${p.best === 'hr' ? 'best-price' : 'bg-slate-900/50'}">
                                <p class="book-name">HR</p>
                                <p class="text-sm font-bold">${p.hr}</p>
                            </div>
                            <div class="text-center p-2 rounded-xl ${p.best === 'mgm' ? 'best-price' : 'bg-slate-900/50'}">
                                <p class="book-name">MGM</p>
                                <p class="text-sm font-bold">${p.mgm}</p>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        document.getElementById('search').addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
