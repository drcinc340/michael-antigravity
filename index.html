<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DRC AI" />
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>DRC Antigravity — Michael Marinucci Jr.</title>
  <style>
    :root {
      --bg-0: #080c14;
      --bg-1: #0f1624;
      --bg-2: #162033;
      --bg-3: #1e2b44;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-2: #3b82f6;
      --emerald: #10b981;
      --amber: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: var(--bg-0);
      color: var(--text);
      overflow: hidden;
    }
    /* Lock Screen */
    #authScreen {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 15%, rgba(139, 92, 246, 0.22), transparent 55%), var(--bg-0);
      padding: 20px;
    }
    .auth-card {
      width: 100%; max-width: 400px;
      background: rgba(15, 22, 36, 0.92);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 32px 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      text-align: center;
      backdrop-filter: blur(16px);
    }
    .brand-orb {
      width: 60px; height: 60px; margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 21px; letter-spacing: 0.5px;
      box-shadow: 0 10px 28px rgba(139, 92, 246, 0.4);
    }
    .auth-card h1 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
    .auth-card p { font-size: 13px; color: var(--muted); margin-bottom: 22px; line-height: 1.45; }
    .pin-input {
      width: 100%; padding: 14px 16px;
      font-size: 22px; font-weight: 700; letter-spacing: 8px; text-align: center;
      border-radius: 14px; border: 1px solid var(--border);
      background: var(--bg-0); color: var(--text); outline: none;
      margin-bottom: 14px;
    }
    .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }
    .btn-primary {
      width: 100%; padding: 13px 18px;
      border: none; border-radius: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
      transition: transform 0.12s, opacity 0.15s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .auth-err { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 18px; }

    /* App Shell */
    #appShell { display: none; height: 100%; width: 100%; }
    #appShell.ready { display: flex; }

    /* Sidebar */
    .sidebar {
      width: 300px; min-width: 300px; height: 100%;
      background: var(--bg-1);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 80;
      transition: transform 0.24s ease;
    }
    .sb-head {
      padding: 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 11px;
    }
    .sb-badge {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; flex-shrink: 0;
    }
    .sb-title h2 { font-size: 14.5px; font-weight: 700; }
    .sb-title span { font-size: 11.5px; color: var(--muted); display: block; }

    .sb-actions { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
    .new-chat-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 14px; border-radius: 11px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-weight: 700; font-size: 13.5px; cursor: pointer;
    }
    .sb-tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
      background: var(--bg-0); padding: 4px; border-radius: 10px;
    }
    .sb-tab {
      padding: 7px 4px; border: none; border-radius: 7px;
      background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 600;
      cursor: pointer; position: relative;
    }
    .sb-tab.active { background: var(--bg-2); color: var(--text); }
    .badge-dot {
      display: inline-block; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 99px; background: var(--danger); color: #fff;
      font-size: 10px; line-height: 16px; margin-left: 3px;
    }

    .sb-scroll { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .section-lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin: 8px 4px 6px; font-weight: 700; }

    .conv-item {
      padding: 10px 11px; border-radius: 10px; margin-bottom: 5px;
      cursor: pointer; border: 1px solid transparent;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .conv-item:hover { background: rgba(255,255,255,0.04); }
    .conv-item.active { background: var(--bg-2); border-color: rgba(139, 92, 246, 0.45); }
    .conv-item-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; word-break: break-word; }
    .conv-item-sub { font-size: 11px; color: var(--muted); }
    .conv-del {
      background: transparent; border: none; color: var(--muted);
      font-size: 14px; cursor: pointer; padding: 2px 5px; border-radius: 5px; opacity: 0.6;
    }
    .conv-del:hover { opacity: 1; color: var(--danger); background: rgba(239, 68, 68, 0.12); }

    .mesh-card, .art-card {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 11px; padding: 11px; margin-bottom: 8px; font-size: 12.5px;
    }
    .mesh-card h4, .art-card h4 { font-size: 13px; margin-bottom: 4px; color: #fff; }
    .mesh-card p, .art-card p { color: var(--muted); font-size: 12px; line-height: 1.4; margin-bottom: 8px; }
    .mini-btn {
      padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--bg-3); color: var(--text); font-size: 11.5px; font-weight: 600;
      cursor: pointer; text-decoration: none; display: inline-block; margin-right: 5px;
    }
    .mini-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    .sb-foot {
      padding: 11px 14px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center;
    }

    /* Main Chat Area */
    .main-pane { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; background: var(--bg-0); }
    .topbar {
      height: 56px; padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 22, 36, 0.85); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .menu-toggle {
      display: none; background: var(--bg-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 9px; padding: 7px 10px; font-size: 16px; cursor: pointer;
    }
    .topbar-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .model-select {
      background: var(--bg-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 9px; padding: 6px 10px; font-size: 12px; font-weight: 600; outline: none; max-width: 220px;
    }

    /* Messages Stream */
    .chat-scroll {
      flex: 1; overflow-y: auto; padding: 20px 18px 28px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .welcome-hero {
      max-width: 760px; margin: 16px auto; width: 100%;
    }
    .welcome-hero h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .welcome-hero p { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; line-height: 1.5; }
    .quick-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px;
    }
    .quick-card {
      background: var(--bg-1); border: 1px solid var(--border);
      border-radius: 13px; padding: 14px; cursor: pointer; text-align: left;
      transition: border-color 0.15s, transform 0.12s; color: var(--text);
    }
    .quick-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .quick-card strong { display: block; font-size: 13.5px; margin-bottom: 4px; }
    .quick-card span { font-size: 12px; color: var(--muted); line-height: 1.35; display: block; }

    .msg-row { max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.assistant { align-items: flex-start; }

    .msg-bubble {
      max-width: 92%; padding: 13px 16px; border-radius: 16px;
      font-size: 14.2px; line-height: 1.58; word-wrap: break-word;
    }
    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #6d28d9, #2563eb);
      color: #fff; border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .msg-bubble {
      background: var(--bg-1); border: 1px solid var(--border);
      color: var(--text); border-bottom-left-radius: 4px; width: 100%;
    }
    .msg-meta { font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 4px; }

    /* Markdown inside assistant bubbles */
    .md-content h1, .md-content h2, .md-content h3 { margin: 12px 0 6px; font-size: 15.5px; color: #fff; }
    .md-content p { margin-bottom: 9px; }
    .md-content ul, .md-content ol { padding-left: 20px; margin-bottom: 9px; }
    .md-content li { margin-bottom: 4px; }
    .md-content code { background: rgba(0,0,0,0.35); padding: 2px 5px; border-radius: 5px; font-size: 12.5px; }
    .md-content pre { background: #05080f; padding: 11px; border-radius: 9px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border); }
    .md-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12.8px; }
    .md-content th, .md-content td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; }
    .md-content th { background: var(--bg-2); }

    /* Tool pills & PDF Artifact cards */
    .tool-pill {
      background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 9px; padding: 7px 11px; margin-bottom: 9px; font-size: 12px;
    }
    .tool-pill summary { cursor: pointer; font-weight: 600; color: #93c5fd; }
    .tool-pill pre { margin-top: 6px; font-size: 11px; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow-y: auto; }

    .pdf-banner {
      margin-top: 11px; padding: 12px 14px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.16), rgba(37, 99, 235, 0.16));
      border: 1px solid rgba(16, 185, 129, 0.45);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .pdf-banner strong { font-size: 13.5px; color: #ecfdf5; display: block; }
    .pdf-banner span { font-size: 11.5px; color: #a7f3d0; }
    .dl-btn {
      padding: 8px 14px; border-radius: 9px; background: var(--emerald); color: #042f2e;
      font-weight: 800; font-size: 12.5px; text-decoration: none;
    }

    .att-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .att-thumb {
      width: 68px; height: 68px; border-radius: 9px; object-fit: cover;
      border: 1px solid rgba(255,255,255,0.25);
    }

    /* Composer */
    .composer-wrap {
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); background: var(--bg-1);
    }
    .composer-inner { max-width: 820px; margin: 0 auto; }
    .pending-files { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .pending-chip {
      background: var(--bg-2); border: 1px solid var(--accent);
      border-radius: 8px; padding: 4px 9px; font-size: 11.5px;
      display: flex; align-items: center; gap: 6px;
    }
    .pending-chip button { background: none; border: none; color: #f87171; cursor: pointer; font-weight: 700; }

    .composer-box {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--bg-0); border: 1px solid var(--border);
      border-radius: 15px; padding: 8px 10px;
    }
    .composer-box:focus-within { border-color: var(--accent); }
    .attach-btn {
      width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-2); color: var(--text); font-size: 18px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    #promptInput {
      flex: 1; background: transparent; border: none; color: var(--text);
      font-size: 15px; line-height: 1.4; max-height: 130px; resize: none; outline: none;
      padding: 7px 4px; font-family: inherit;
    }
    .send-btn {
      height: 38px; padding: 0 16px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-weight: 700; font-size: 13.5px; cursor: pointer; flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .drawer-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 70;
    }
    @media (max-width: 820px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .drawer-backdrop.open { display: block; }
      .menu-toggle { display: inline-flex; }
    }
  </style>
</head>
<body>
  <!-- Lock Screen -->
  <div id="authScreen">
    <div class="auth-card">
      <div class="brand-orb">DRC</div>
      <h1>DRC Antigravity</h1>
      <p>Michael Marinucci Jr. • Sales &amp; Estimating AI<br/>Dinverno Remodeling and Construction</p>
      <form id="loginForm">
        <input id="pinField" class="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off" required />
        <button type="submit" class="btn-primary" id="unlockBtn">Unlock Workspace</button>
      </form>
      <div class="auth-err" id="authErr"></div>
    </div>
  </div>

  <!-- Main Workspace -->
  <div id="appShell">
    <div class="drawer-backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="sb-badge">MM</div>
        <div class="sb-title">
          <h2>Michael Marinucci Jr.</h2>
          <span>Dinverno Remodeling • +1 (248) 431-4609</span>
        </div>
      </div>
      <div class="sb-actions">
        <button class="new-chat-btn" id="newChatBtn">＋ New Consultation Chat</button>
        <div class="sb-tabs">
          <button class="sb-tab active" data-tab="chats">Chats</button>
          <button class="sb-tab" data-tab="mesh">Adriano <span id="meshBadge" class="badge-dot" style="display:none">0</span></button>
          <button class="sb-tab" data-tab="pdfs">Proposals</button>
        </div>
      </div>
      <div class="sb-scroll" id="sbContent"></div>
      <div class="sb-foot">
        <span>DRC Sales Sandbox Active</span>
        <button class="mini-btn" id="lockBtn">Lock</button>
      </div>
    </aside>

    <main class="main-pane">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <button class="menu-toggle" id="menuBtn">☰</button>
          <div class="topbar-title" id="chatHeaderTitle">DRC Sales &amp; Estimating Assistant</div>
        </div>
        <select id="modelSelect" class="model-select">
          <option value="gemini-3.5-flash">⚡ Gemini 3.5 Pro-Flash</option>
          <option value="gemini-flash-lite-latest">🚀 Instant Field Mode</option>
          <option value="gemini-3.1-flash-lite">⚖️ Gemini 3.1 Balanced</option>
        </select>
      </header>

      <section class="chat-scroll" id="chatScroll"></section>

      <footer class="composer-wrap">
        <div class="composer-inner">
          <div class="pending-files" id="pendingFiles"></div>
          <div class="composer-box">
            <input type="file" id="filePicker" multiple accept="image/*,.pdf" style="display:none" />
            <button type="button" class="attach-btn" id="attachBtn" title="Upload Jobsite Photo or Blueprint PDF">📷</button>
            <textarea id="promptInput" rows="1" placeholder="Ask for a Good/Better/Best PDF quote, upload a jobsite photo, check MI code, or check your DRC CRM..."></textarea>
            <button type="button" class="send-btn" id="sendBtn">Send ↑</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script>
    const STORAGE_PIN_KEY = 'drc_michael_rep_pin_v1';
    const STORAGE_API_KEY = 'drc_michael_api_base_v1';

    let state = {
      pin: sessionStorage.getItem(STORAGE_PIN_KEY) || localStorage.getItem(STORAGE_PIN_KEY) || '',
      apiBase: '',
      activeTab: 'chats',
      activeConvId: null,
      conversations: [],
      artifacts: [],
      meshTickets: [],
      pendingUploads: [],
      busy: false
    };

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderMarkdown(md) {
      let html = esc(md || '');
      html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
      html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/^\s*[-•*]\s+(.*)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
      html = html.replace(/\n\n+/g, '</p><p>');
      html = `<p>${html.replace(/\n/g, '<br/>')}</p>`;
      return html;
    }

    async function decryptSlot(encObj, pin) {
      const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
      const enc = new TextEncoder();
      const keyMat = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(encObj.salt), iterations: encObj.iter || 100000, hash: 'SHA-256' },
        keyMat,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(encObj.iv) }, key, b64(encObj.ct));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    async function resolveApiBase(pin) {
      // If hosted directly on the tunnel or LAN server, /api/status exists on same origin
      if (!location.hostname.endsWith('github.io')) {
        return location.origin;
      }
      const res = await fetch(`./tunnel.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Unable to load live DRC tunnel beacon');
      const beacon = await res.json();
      for (const slotName of ['rep_slot', 'overseer_slot']) {
        if (beacon[slotName]) {
          try {
            const dec = await decryptSlot(beacon[slotName], pin);
            if (dec && dec.tunnelUrl) return dec.tunnelUrl.replace(/\/$/, '');
          } catch (_) {}
        }
      }
      throw new Error('Incorrect PIN');
    }

    async function apiFetch(path, opts = {}) {
      const headers = Object.assign({}, opts.headers || {}, { 'x-access-pin': state.pin });
      if (!(opts.body instanceof FormData) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      const resp = await fetch(`${state.apiBase}${path}`, { ...opts, headers });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      return data;
    }

    async function tryUnlock(pin) {
      const errEl = document.getElementById('authErr');
      const btn = document.getElementById('unlockBtn');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connecting…';
      try {
        const base = await resolveApiBase(pin);
        const loginRes = await fetch(`${base}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin, role: 'rep' })
        });
        const loginData = await loginRes.json();
        if (!loginRes.ok || !loginData.success) throw new Error(loginData.error || 'Incorrect PIN');
        state.pin = pin;
        state.apiBase = base;
        localStorage.setItem(STORAGE_PIN_KEY, pin);
        sessionStorage.setItem(STORAGE_PIN_KEY, pin);
        localStorage.setItem(STORAGE_API_KEY, base);
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appShell').classList.add('ready');
        await refreshBootstrap();
        renderWelcomeOrActiveChat();
      } catch (e) {
        errEl.textContent = e.message || 'Authentication failed';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Unlock Workspace';
      }
    }

    async function refreshBootstrap() {
      const data = await apiFetch('/api/rep/bootstrap');
      state.conversations = data.conversations || [];
      state.artifacts = data.artifacts || [];
      state.meshTickets = data.mesh_tickets || [];
      const badge = document.getElementById('meshBadge');
      if (data.pending_mesh_count > 0) {
        badge.style.display = 'inline-block';
        badge.textContent = data.pending_mesh_count;
      } else {
        badge.style.display = 'none';
      }
      renderSidebar();
    }

    function renderSidebar() {
      const box = document.getElementById('sbContent');
      if (state.activeTab === 'chats') {
        if (!state.conversations.length) {
          box.innerHTML = `<div style="padding:18px 8px;color:var(--muted);font-size:12.5px;text-align:center;">No consultations yet.<br/>Tap a workflow card or ask anything below!</div>`;
          return;
        }
        box.innerHTML = `<div class="section-lbl">Recent Consultations</div>` + state.conversations.map(c => `
          <div class="conv-item ${c.id === state.activeConvId ? 'active' : ''}" onclick="openConversation('${esc(c.id)}')">
            <div style="min-width:0;flex:1;">
              <div class="conv-item-title">${esc(c.title)}</div>
              <div class="conv-item-sub">${esc((c.updated_at || '').replace('T',' ').slice(0,16))} • ${c.message_count || 0} msgs</div>
            </div>
            <button class="conv-del" title="Remove from list" onclick="event.stopPropagation();archiveConv('${esc(c.id)}')">✕</button>
          </div>
        `).join('');
      } else if (state.activeTab === 'mesh') {
        let html = `<div class="section-lbl">Dispatches from Adriano Vagnini</div>`;
        html += `<button class="mini-btn primary" style="width:100%;margin-bottom:10px;text-align:center;" onclick="quickPrompt('Send a DRC Mesh field update to Adriano Vagnini: ')">📡 Send Field Update to Adriano</button>`;
        if (!state.meshTickets.length) {
          html += `<div style="padding:14px 6px;color:var(--muted);font-size:12px;text-align:center;">No dispatches in your inbox right now.</div>`;
        } else {
          html += state.meshTickets.map(t => `
            <div class="mesh-card">
              <h4>[${esc(t.priority || 'HIGH')}] ${esc(t.title || t.subject)}</h4>
              <p>${esc(t.description || '')}</p>
              <div style="font-size:10.5px;color:var(--muted);margin-bottom:7px;">${esc(t.ticket_id)} • Status: <b>${esc((t.status||'pending').toUpperCase())}</b></div>
              <button class="mini-btn primary" onclick="workOnMesh('${esc(t.ticket_id)}','${esc((t.title||'').replace(/'/g,''))}','${esc((t.description||'').replace(/'/g,'').replace(/\n/g,' '))}')">Open with AI</button>
            </div>
          `).join('');
        }
        box.innerHTML = html;
      } else {
        let html = `<div class="section-lbl">Generated Proposals &amp; Scopes</div>`;
        if (!state.artifacts.length) {
          html += `<div style="padding:14px 6px;color:var(--muted);font-size:12px;text-align:center;">Ask me to build any Good/Better/Best quote and your Proposal PDFs will appear here.</div>`;
        } else {
          html += state.artifacts.map(a => `
            <div class="art-card">
              <h4>📄 ${esc(a.title)}</h4>
              <p>${esc(a.filename)} (${Math.max(1, Math.round((a.size_bytes||0)/1024))} KB)</p>
              <a class="mini-btn primary" target="_blank" href="${state.apiBase}${a.download_url}?pin=${encodeURIComponent(state.pin)}">Download / Print PDF</a>
            </div>
          `).join('');
        }
        box.innerHTML = html;
      }
    }

    const QUICK_CARDS = [
      {
        title: '📋 Good / Better / Best Proposal PDF',
        desc: 'Generate a branded Dinverno Remodeling PDF quote + follow-up text in seconds',
        prompt: 'Build a Good / Better / Best DRC Proposal PDF for homeowner John & Sarah Miller at 14250 Riverside Dr, Livonia, MI 48154 (Phone: 248-555-0148) for 110 linear ft of interior basement waterproofing + 6 bowed wall carbon-fiber straps.'
      },
      {
        title: '📸 Jobsite Photo & Blueprint Takeoff',
        desc: 'Attach basement, roof, porch, or plan photos for damage & material quantities',
        prompt: 'Analyze the attached jobsite photo(s), identify all visible structural/moisture/code issues, estimate quantities, and recommend Good / Better / Best options.'
      },
      {
        title: '📐 Michigan Code & BS&A Permit Check',
        desc: '42" frost footings, 6x6 anchored posts, egress windows, Ice & Water Shield',
        prompt: 'Give me the Michigan Residential Code requirements and DRC BS&A / Job Box inspection checklist for a 16x20 four-season sunroom addition in Livonia / Canton.'
      },
      {
        title: '📅 My DRC CRM Schedule & Lead Entry',
        desc: 'Check my assigned appointments in Dinverno OS v2 or log consultation notes',
        prompt: 'Check my upcoming assigned appointments and recent activity in DRC CRM.'
      },
      {
        title: '📡 Check Tasks from Adriano',
        desc: 'Pull dispatches from Adriano Vagnini via DRC Agent Mesh & send updates',
        prompt: 'Check my DRC Agent Mesh inbox for any tasks or leads from Adriano Vagnini.'
      },
      {
        title: '🎯 Overcome Price / "Think About It"',
        desc: ' DRC consultation closing scripts, draw schedule transparency & warranty framing',
        prompt: 'Give me a sharp in-home DRC script when a homeowner says another contractor quoted $3,500 less on a roof or waterproofing job.'
      }
    ];

    function renderWelcomeOrActiveChat() {
      if (state.activeConvId) return;
      document.getElementById('chatHeaderTitle').textContent = 'DRC Sales & Estimating Assistant';
      const sc = document.getElementById('chatScroll');
      sc.innerHTML = `
        <div class="welcome-hero">
          <h2>Hey Michael — Ready for Your Next Appointment 👋</h2>
          <p>Your custom <b>Dinverno Remodeling and Construction</b> AI workspace. Build Good/Better/Best Proposal PDFs, inspect jobsite photos, verify Michigan Residential Code, or sync your DRC CRM leads.</p>
          <div class="quick-grid">
            ${QUICK_CARDS.map((c, idx) => `
              <button class="quick-card" onclick="useQuickCard(${idx})">
                <strong>${esc(c.title)}</strong>
                <span>${esc(c.desc)}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    window.useQuickCard = function(idx) {
      const card = QUICK_CARDS[idx];
      const inp = document.getElementById('promptInput');
      inp.value = card.prompt;
      inp.focus();
      autoResizeInput();
    };

    window.quickPrompt = function(txt) {
      closeMobileDrawer();
      const inp = document.getElementById('promptInput');
      inp.value = txt;
      inp.focus();
      autoResizeInput();
    };

    window.workOnMesh = function(tid, title, desc) {
      closeMobileDrawer();
      state.activeConvId = null;
      renderWelcomeOrActiveChat();
      const inp = document.getElementById('promptInput');
      inp.value = `Help me complete Adriano's Mesh Task [${tid}] "${title}": ${desc}`;
      inp.focus();
      autoResizeInput();
    };

    window.openConversation = async function(convId) {
      closeMobileDrawer();
      state.activeConvId = convId;
      renderSidebar();
      const data = await apiFetch(`/api/rep/conversations/${convId}`);
      document.getElementById('chatHeaderTitle').textContent = data.conversation.title || 'Consultation';
      renderMessages(data.messages || []);
    };

    window.archiveConv = async function(convId) {
      await apiFetch(`/api/rep/conversations/${convId}`, { method: 'DELETE' });
      if (state.activeConvId === convId) {
        state.activeConvId = null;
        renderWelcomeOrActiveChat();
      }
      await refreshBootstrap();
    };

    function renderMessages(messages) {
      const sc = document.getElementById('chatScroll');
      if (!messages.length) {
        renderWelcomeOrActiveChat();
        return;
      }
      sc.innerHTML = messages.map(m => {
        const isUser = m.role === 'user';
        const atts = (m.attachments || []).map(a =>
          (a.mime_type || '').startsWith('image/')
            ? `<a target="_blank" href="${state.apiBase}${a.url}?pin=${encodeURIComponent(state.pin)}"><img class="att-thumb" src="${state.apiBase}${a.url}?pin=${encodeURIComponent(state.pin)}" alt="${esc(a.original_name)}"/></a>`
            : `<a class="mini-btn" target="_blank" href="${state.apiBase}${a.url}?pin=${encodeURIComponent(state.pin)}">📎 ${esc(a.original_name)}</a>`
        ).join('');

        const tools = (m.tool_calls || []).map(tc => `
          <details class="tool-pill">
            <summary>⚡ Executed <code>${esc(tc.name)}</code> (${tc.duration_ms || 0} ms)</summary>
            <pre>${esc(JSON.stringify(tc.args, null, 2))}</pre>
          </details>
        `).join('');

        const arts = (m.artifacts || []).map(a => `
          <div class="pdf-banner">
            <div>
              <strong>📄 ${esc(a.title)}</strong>
              <span>${esc(a.filename)} • Ready to share or print</span>
            </div>
            <a class="dl-btn" target="_blank" href="${state.apiBase}${a.download_url}?pin=${encodeURIComponent(state.pin)}">Open PDF ↗</a>
          </div>
        `).join('');

        return `
          <div class="msg-row ${isUser ? 'user' : 'assistant'}">
            <div class="msg-bubble">
              ${atts ? `<div class="att-strip">${atts}</div>` : ''}
              ${!isUser ? tools : ''}
              <div class="${isUser ? '' : 'md-content'}">${isUser ? esc(m.content).replace(/\n/g,'<br/>') : renderMarkdown(m.content)}</div>
              ${!isUser ? arts : ''}
            </div>
            <div class="msg-meta">${isUser ? 'Michael' : 'DRC Antigravity'} • ${esc((m.created_at||'').replace('T',' ').slice(11,16))}</div>
          </div>
        `;
      }).join('');
      sc.scrollTop = sc.scrollHeight;
    }

    function renderPendingUploads() {
      const box = document.getElementById('pendingFiles');
      box.innerHTML = state.pendingUploads.map((u, idx) => `
        <div class="pending-chip">
          <span>📎 ${esc(u.original_name)}</span>
          <button type="button" onclick="removePending(${idx})">✕</button>
        </div>
      `).join('');
    }
    window.removePending = function(i) {
      state.pendingUploads.splice(i, 1);
      renderPendingUploads();
    };

    async function handleFileSelect(ev) {
      const files = Array.from(ev.target.files || []);
      if (!files.length) return;
      const fd = new FormData();
      if (state.activeConvId) fd.append('conversation_id', state.activeConvId);
      files.forEach(f => fd.append('files', f));
      const btn = document.getElementById('attachBtn');
      btn.textContent = '⏳';
      try {
        const res = await apiFetch('/api/rep/upload', { method: 'POST', body: fd });
        (res.uploads || []).forEach(u => state.pendingUploads.push(u));
        renderPendingUploads();
      } catch (e) {
        alert('Upload error: ' + e.message);
      } finally {
        btn.textContent = '📷';
        ev.target.value = '';
      }
    }

    async function sendPrompt() {
      if (state.busy) return;
      const inp = document.getElementById('promptInput');
      const text = inp.value.trim();
      if (!text && !state.pendingUploads.length) return;

      state.busy = true;
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = 'Working…';

      const promptText = text || 'Analyze the attached jobsite file(s) and provide recommendations.';
      const uploadIds = state.pendingUploads.map(u => u.id);
      inp.value = '';
      autoResizeInput();
      state.pendingUploads = [];
      renderPendingUploads();

      // Optimistic bubble
      const sc = document.getElementById('chatScroll');
      if (sc.querySelector('.welcome-hero')) sc.innerHTML = '';
      sc.insertAdjacentHTML('beforeend', `
        <div class="msg-row user">
          <div class="msg-bubble">${esc(promptText).replace(/\n/g,'<br/>')}</div>
        </div>
        <div class="msg-row assistant" id="thinkingBubble">
          <div class="msg-bubble" style="color:var(--muted);">⚡ Analyzing &amp; running DRC tools…</div>
        </div>
      `);
      sc.scrollTop = sc.scrollHeight;

      try {
        const model = document.getElementById('modelSelect').value;
        const res = await apiFetch('/api/rep/chat', {
          method: 'POST',
          body: JSON.stringify({
            conversation_id: state.activeConvId || '',
            message: promptText,
            upload_ids: uploadIds,
            model
          })
        });
        state.activeConvId = res.conversation.id;
        document.getElementById('chatHeaderTitle').textContent = res.conversation.title;
        await refreshBootstrap();
        const convData = await apiFetch(`/api/rep/conversations/${state.activeConvId}`);
        renderMessages(convData.messages || []);
      } catch (e) {
        const tb = document.getElementById('thinkingBubble');
        if (tb) tb.innerHTML = `<div class="msg-bubble" style="border-color:var(--danger);color:#fca5a5;">⚠️ ${esc(e.message)}</div>`;
      } finally {
        state.busy = false;
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send ↑';
      }
    }

    function autoResizeInput() {
      const inp = document.getElementById('promptInput');
      inp.style.height = 'auto';
      inp.style.height = Math.min(130, inp.scrollHeight) + 'px';
    }

    function closeMobileDrawer() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('backdrop').classList.remove('open');
    }

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      tryUnlock(document.getElementById('pinField').value.trim());
    });
    document.getElementById('newChatBtn').addEventListener('click', () => {
      closeMobileDrawer();
      state.activeConvId = null;
      renderSidebar();
      renderWelcomeOrActiveChat();
    });
    document.querySelectorAll('.sb-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sb-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.activeTab = btn.dataset.tab;
        renderSidebar();
      });
    });
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('backdrop').classList.add('open');
    });
    document.getElementById('backdrop').addEventListener('click', closeMobileDrawer);
    document.getElementById('lockBtn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_PIN_KEY);
      sessionStorage.removeItem(STORAGE_PIN_KEY);
      location.reload();
    });
    document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('filePicker').click());
    document.getElementById('filePicker').addEventListener('change', handleFileSelect);
    document.getElementById('sendBtn').addEventListener('click', sendPrompt);
    document.getElementById('promptInput').addEventListener('input', autoResizeInput);
    document.getElementById('promptInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
        e.preventDefault();
        sendPrompt();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    if (state.pin) {
      document.getElementById('pinField').value = state.pin;
      tryUnlock(state.pin);
    }
    // Poll Adriano mesh updates quietly every 15s
    setInterval(() => {
      if (state.pin && state.apiBase && !state.busy) refreshBootstrap().catch(() => {});
    }, 15000);
  </script>
</body>
</html>
